<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bollywood Radio</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        linear-gradient(
            rgba(0,0,0,0.18),
            rgba(0,0,0,0.35)
        ),
        url("file_00000000331c82118c697d6c820bd728.png");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    padding: 18px 0;
}

/* MAIN RADIO BOX */

.player {

    width: 78%;
    max-width: 350px;

    padding: 20px 16px;

    color: white;

    text-align: center;

    background: rgba(8,8,8,0.58);

    border: 1px solid rgba(255,255,255,0.18);

    border-radius: 24px;

    box-shadow:
        0 12px 40px rgba(0,0,0,0.55),
        inset 0 0 25px rgba(255,190,80,0.07);

    backdrop-filter: blur(4px);
}

/* ONLINE */

.online {

    display: inline-block;

    padding: 6px 12px;

    margin-bottom: 10px;

    border-radius: 20px;

    background: rgba(30,150,70,0.9);

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 0.5px;
}

/* LOGO */

.logo {

    font-size: 25px;

    font-weight: bold;

    letter-spacing: 1.5px;

    margin-bottom: 5px;

    text-shadow: 0 3px 15px black;
}

/* SUBTITLE */

.subtitle {

    font-size: 12px;

    opacity: 0.85;

    margin-bottom: 17px;
}

/* SONG STATUS */

.tuning {

    font-size: 14px;

    margin-bottom: 16px;

    opacity: 0.95;
}

/* EQUALIZER */

.equalizer {

    display: flex;

    justify-content: center;

    align-items: flex-end;

    gap: 4px;

    height: 30px;

    margin-bottom: 18px;
}

.equalizer span {

    width: 4px;

    height: 12px;

    background: #f2b84b;

    border-radius: 5px;

    animation: music 0.8s infinite alternate;
}

.equalizer span:nth-child(2) {
    animation-delay: .2s;
}

.equalizer span:nth-child(3) {
    animation-delay: .4s;
}

.equalizer span:nth-child(4) {
    animation-delay: .1s;
}

.equalizer span:nth-child(5) {
    animation-delay: .3s;
}

@keyframes music {

    from {
        height: 7px;
    }

    to {
        height: 28px;
    }

}

/* BUTTONS */

.controls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 14px;
}

button {

    border: none;

    width: 50px;

    height: 50px;

    border-radius: 50%;

    background: rgba(255,255,255,0.95);

    color: #111;

    font-size: 19px;

    cursor: pointer;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.35);
}

button:active {

    transform: scale(0.92);
}

.play {

    width: 65px;

    height: 65px;

    font-size: 25px;

    background: #f2b84b;
}

/* YOUTUBE PLAYER HIDDEN */

#youtube-player {

    position: absolute;

    width: 1px;

    height: 1px;

    opacity: 0;

    pointer-events: none;
}

/* FOOTER */

.footer {

    margin-top: 17px;

    font-size: 9px;

    opacity: 0.6;

    letter-spacing: 1px;
}

</style>

</head>

<body>


<div class="player">


    <!-- ONLINE LISTENER COUNT -->

    <div class="online">

        ● <span id="listenerCount">
            2,000 LISTENERS
        </span>

    </div>


    <!-- RADIO NAME -->

    <div class="logo">

        BOLLYWOOD RADIO

    </div>


    <div class="subtitle">

        Your Bollywood songs, one after another 🎶

    </div>


    <!-- SONG STATUS -->

    <div class="tuning" id="status">

        🎵 Ready to play

    </div>


    <!-- EQUALIZER -->

    <div class="equalizer">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- HIDDEN YOUTUBE -->

    <div id="youtube-player"></div>


    <!-- CONTROLS -->

    <div class="controls">

        <button onclick="previousSong()">

            ⏮

        </button>


        <button
            class="play"
            onclick="playPause()"
        >

            ▶

        </button>


        <button onclick="nextSong()">

            ⏭

        </button>

    </div>


    <div class="footer">

        BOLLYWOOD RADIO

    </div>


</div>



<!-- YOUTUBE API -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>


/* =========================================
   YOUTUBE SONGS
   YAHAN BAAD MEIN AUR GANE ADD KAR SAKTE HO
   ========================================= */

const songs = [

    "Mj3KyjuKbqI",

    "O5qahfzGtc8",

    "LMpSZWT1O78",

    "7Ny77gTsWGk",

    "6NmqPrUftI8",

    "8hy7pg8wB-c",

    "A1wZUXY--4U",

    "5SGxpmPt9j0",

    "3_cGT6rXp6w",

    "XEggdtDp_4c",

    "Wk-YDaTAwyI",

    "wtlNGAXKkP4",

    "ZCLQ36O2HiA",

    "hUxn5TZzTqo",

    "5EZagydXjNU",

    "5MIGQBpVeqs"

];



/* =========================================
   RANDOM START
   ========================================= */

let currentSong =
    Math.floor(Math.random() * songs.length);


let player = null;

let isPlaying = false;



/* =========================================
   YOUTUBE PLAYER READY
   ========================================= */

function onYouTubeIframeAPIReady() {

    player = new YT.Player(
        "youtube-player",
        {

            videoId: songs[currentSong],

            playerVars: {

                controls: 0,

                rel: 0,

                modestbranding: 1

            },

            events: {

                onReady: function() {

                    document.getElementById(
                        "status"
                    ).textContent =
                        "🎵 Ready to play";

                },

                onStateChange:
                    songStateChanged

            }

        }
    );

}



/* =========================================
   PLAY / PAUSE
   ========================================= */

function playPause() {

    if (!player) return;


    if (isPlaying) {

        player.pauseVideo();

        document.querySelector(
            ".play"
        ).textContent = "▶";


        document.getElementById(
            "status"
        ).textContent = "⏸ Paused";


        isPlaying = false;

    }

    else {

        player.playVideo();

        document.querySelector(
            ".play"
        ).textContent = "⏸";


        document.getElementById(
            "status"
        ).textContent = "🎵 Now playing";


        isPlaying = true;

    }

}



/* =========================================
   NEXT SONG
   ========================================= */

function nextSong() {

    if (!player) return;


    currentSong++;

    if (
        currentSong >= songs.length
    ) {

        currentSong = 0;

    }


    player.loadVideoById(
        songs[currentSong]
    );


    isPlaying = true;


    document.querySelector(
        ".play"
    ).textContent = "⏸";


    document.getElementById(
        "status"
    ).textContent = "🎵 Now playing";

}



/* =========================================
   PREVIOUS SONG
   ========================================= */

function previousSong() {

    if (!player) return;


    currentSong--;


    if (currentSong < 0) {

        currentSong =
            songs.length - 1;

    }


    player.loadVideoById(
        songs[currentSong]
    );


    isPlaying = true;


    document.querySelector(
        ".play"
    ).textContent = "⏸";


    document.getElementById(
        "status"
    ).textContent = "🎵 Now playing";

}



/* =========================================
   SONG FINISHED
   RANDOM NEXT SONG
   ========================================= */

function songStateChanged(event) {

    if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        let newSong;


        do {

            newSong =
                Math.floor(
                    Math.random() *
                    songs.length
                );

        }

        while (
            songs.length > 1 &&
            newSong === currentSong
        );


        currentSong = newSong;


        player.loadVideoById(
            songs[currentSong]
        );


        isPlaying = true;


        document.querySelector(
            ".play"
        ).textContent = "⏸";


        document.getElementById(
            "status"
        ).textContent =
            "🎵 Now playing";

    }

}



/* =========================================
   LISTENER DISPLAY
   ABHI DEMO NUMBER HAI
   ========================================= */

let listeners =
    Math.floor(
        Math.random() * 300
    ) + 1800;


function updateListeners() {

    let change =
        Math.floor(
            Math.random() * 11
        ) - 5;


    listeners += change;


    if (listeners < 1500) {

        listeners = 1500;

    }


    if (listeners > 2500) {

        listeners = 2500;

    }


    document.getElementById(
        "listenerCount"
    ).textContent =
        listeners.toLocaleString() +
        " LISTENERS";

}


updateListeners();


setInterval(
    updateListeners,
    7000
);


</script>

</body>

</html>
