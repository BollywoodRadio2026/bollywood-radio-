<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bollywood Radio</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        linear-gradient(
            rgba(0,0,0,0.30),
            rgba(0,0,0,0.50)
        ),
        url("file_00000000331c82118c697d6c820bd728.png");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    color: white;
}

/* MAIN RADIO CARD */

.player {
    width: 92%;
    max-width: 430px;

    padding: 25px 20px;

    text-align: center;

    background: rgba(18, 14, 12, 0.65);

    border: 1px solid rgba(255,255,255,0.18);

    border-radius: 28px;

    box-shadow:
        0 15px 50px rgba(0,0,0,0.65),
        inset 0 0 35px rgba(255,190,80,0.08);

    backdrop-filter: blur(6px);
}

/* ONLINE */

.online {
    display: inline-block;

    padding: 6px 13px;

    margin-bottom: 12px;

    border-radius: 20px;

    background: rgba(25,145,65,0.88);

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 1px;
}

/* LOGO */

.logo {
    font-size: 29px;

    font-weight: bold;

    letter-spacing: 2px;

    margin-bottom: 5px;

    text-shadow: 0 3px 15px black;
}

/* SUBTITLE */

.subtitle {
    font-size: 13px;

    opacity: 0.85;

    margin-bottom: 23px;
}

/* LISTENERS */

.listeners {
    font-size: 14px;

    margin-bottom: 18px;

    opacity: 0.95;
}

#listenerCount {
    font-weight: bold;

    color: #f2c15a;

    font-size: 16px;
}

/* TUNING */

.tuning {
    font-size: 16px;

    margin-bottom: 18px;

    opacity: 0.95;
}

/* EQUALIZER */

.equalizer {
    display: flex;

    justify-content: center;

    align-items: flex-end;

    gap: 4px;

    height: 35px;

    margin-bottom: 25px;
}

.equalizer span {
    width: 4px;

    height: 10px;

    background: #f2b84b;

    border-radius: 5px;

    animation: music 0.8s infinite alternate;
}

.equalizer span:nth-child(2) {
    animation-delay: .15s;
}

.equalizer span:nth-child(3) {
    animation-delay: .3s;
}

.equalizer span:nth-child(4) {
    animation-delay: .45s;
}

.equalizer span:nth-child(5) {
    animation-delay: .2s;
}

@keyframes music {

    from {
        height: 7px;
    }

    to {
        height: 32px;
    }

}

/* CONTROLS */

.controls {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 18px;
}

button {
    border: none;

    width: 55px;

    height: 55px;

    border-radius: 50%;

    background: rgba(255,255,255,0.92);

    color: #111;

    font-size: 21px;

    cursor: pointer;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.45);

    transition: 0.15s;
}

button:active {
    transform: scale(0.90);
}

.play {
    width: 72px;

    height: 72px;

    font-size: 28px;

    background: #f2b84b;
}

/* YOUTUBE PLAYER */

#youtube-player {

    position: absolute;

    width: 1px;

    height: 1px;

    opacity: 0;

    pointer-events: none;
}

/* FOOTER */

.footer {

    margin-top: 24px;

    font-size: 10px;

    opacity: 0.55;

    letter-spacing: 1.5px;
}

/* MOBILE */

@media (max-width: 500px) {

    .player {
        padding: 23px 17px;
    }

    .logo {
        font-size: 26px;
    }

}

</style>

</head>

<body>


<div class="player">

    <div class="online">
        ● ONLINE
    </div>


    <div class="logo">
        BOLLYWOOD RADIO
    </div>


    <div class="subtitle">
        Tuning in to Timeless Melodies 🎶
    </div>


    <div class="listeners">
        🎧 <span id="listenerCount">2,024</span> people are listening
    </div>


    <div class="tuning" id="tuningText">
        🎵 Tuning in...
    </div>


    <div class="equalizer">

        <span></span>

        <span></span>

        <span></span>

        <span></span>

        <span></span>

    </div>


    <div id="youtube-player"></div>


    <div class="controls">

        <button onclick="previousSong()">
            ⏮
        </button>


        <button
            class="play"
            onclick="playPause()"
            id="playButton">
            ▶
        </button>


        <button onclick="nextSong()">
            ⏭
        </button>

    </div>


    <div class="footer">
        BOLLYWOOD RADIO • TIMELESS MELODIES
    </div>

</div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =========================================
   YOUR 10 SONGS
   ========================================= */

const songs = [

    "YnYHfIRjhGE",

    "1VdMEriTiDk",

    "tADaTIFoJVM",

    "HUZhV8EFrNU",

    "o-iUnredK5c",

    "e5ff83TbWR4",

    "uA_qKTU3cy8",

    "PWyXe6fzsmM",

    "RpRtGHcRX54",

    "lYzA4N2jZAA"

];


/* =========================================
   RANDOM START
   ========================================= */

let currentSong =
    Math.floor(Math.random() * songs.length);

let player;

let isPlaying = false;


/* =========================================
   YOUTUBE PLAYER
   ========================================= */

function onYouTubeIframeAPIReady() {

    player = new YT.Player(
        "youtube-player",
        {

            videoId: songs[currentSong],

            playerVars: {

                controls: 0,

                rel: 0,

                modestbranding: 1,

                playsinline: 1

            },

            events: {

                onReady: playerReady,

                onStateChange: songStateChanged

            }

        }
    );

}


/* =========================================
   PLAYER READY
   ========================================= */

function playerReady() {

    document.getElementById(
        "tuningText"
    ).textContent = "🎵 Ready to play...";

}


/* =========================================
   PLAY / PAUSE
   ========================================= */

function playPause() {

    if (!player) return;


    if (isPlaying) {

        player.pauseVideo();

        document.getElementById(
            "playButton"
        ).textContent = "▶";

        isPlaying = false;

    }

    else {

        player.playVideo();

        document.getElementById(
            "playButton"
        ).textContent = "⏸";

        isPlaying = true;

        document.getElementById(
            "tuningText"
        ).textContent = "🎵 Now Playing...";

    }

}


/* =========================================
   NEXT SONG
   ========================================= */

function nextSong() {

    if (!player) return;


    currentSong++;

    if (currentSong >= songs.length) {

        currentSong = 0;

    }


    player.loadVideoById(
        songs[currentSong]
    );


    isPlaying = true;


    document.getElementById(
        "playButton"
    ).textContent = "⏸";


    document.getElementById(
        "tuningText"
    ).textContent = "🎵 Now Playing...";

}


/* =========================================
   PREVIOUS SONG
   ========================================= */

function previousSong() {

    if (!player) return;


    currentSong--;

    if (currentSong < 0) {

        currentSong = songs.length - 1;

    }


    player.loadVideoById(
        songs[currentSong]
    );


    isPlaying = true;


    document.getElementById(
        "playButton"
    ).textContent = "⏸";


    document.getElementById(
        "tuningText"
    ).textContent = "🎵 Now Playing...";

}


/* =========================================
   SONG FINISHED
   ========================================= */

function songStateChanged(event) {

    if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        nextSong();

    }

}


/* =========================================
   RANDOM LISTENER NUMBER
   =========================================

   Number will stay around the same range
   and keep changing slightly.
*/

let listenerCount =
    Math.floor(
        Math.random() * 3000
    ) + 2000;


function updateListeners() {

    let change =
        Math.floor(
            Math.random() * 41
        ) - 20;


    listenerCount += change;


    if (listenerCount < 1000) {

        listenerCount = 1000;

    }


    if (listenerCount > 9999) {

        listenerCount = 9999;

    }


    document.getElementById(
        "listenerCount"
    ).textContent =
        listenerCount.toLocaleString();

}


/* Change listener number
   every 5–10 seconds */

function randomListenerUpdate() {

    updateListeners();


    let nextChange =
        Math.floor(
            Math.random() * 5000
        ) + 5000;


    setTimeout(
        randomListenerUpdate,
        nextChange
    );

}


randomListenerUpdate();

</script>


</body>
            </html>
