<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bollywood Radio</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    background:
        linear-gradient(
            rgba(0,0,0,0.28),
            rgba(0,0,0,0.58)
        ),
        url("./file_00000000331c82118c697d6c820bd728.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    font-family: Arial, sans-serif;

    color: white;
}

.player {
    width: 100%;
    max-width: 430px;

    padding: 30px 20px;

    text-align: center;

    background: rgba(10, 10, 10, 0.55);

    border: 1px solid rgba(255,255,255,0.25);

    border-radius: 28px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.65),
        inset 0 0 35px rgba(255,200,100,0.08);

    backdrop-filter: blur(4px);
}

.online {
    display: inline-block;

    padding: 6px 13px;

    margin-bottom: 15px;

    border-radius: 20px;

    background: rgba(35,155,75,0.9);

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 1px;
}

.logo {
    font-size: 30px;

    font-weight: bold;

    letter-spacing: 2px;

    text-shadow:
        0 3px 15px rgba(0,0,0,0.9);

    margin-bottom: 8px;
}

.subtitle {
    font-size: 13px;

    opacity: 0.85;

    margin-bottom: 25px;
}

.tuning {
    font-size: 15px;

    margin-bottom: 15px;

    opacity: 0.95;
}

.equalizer {
    height: 38px;

    display: flex;

    justify-content: center;

    align-items: flex-end;

    gap: 5px;

    margin-bottom: 25px;
}

.equalizer span {
    width: 5px;

    height: 12px;

    border-radius: 5px;

    background: #f4bd55;

    animation: music 0.75s infinite alternate;
}

.equalizer span:nth-child(2) {
    animation-delay: .15s;
}

.equalizer span:nth-child(3) {
    animation-delay: .3s;
}

.equalizer span:nth-child(4) {
    animation-delay: .45s;
}

.equalizer span:nth-child(5) {
    animation-delay: .2s;
}

@keyframes music {

    from {
        height: 8px;
    }

    to {
        height: 35px;
    }

}

.controls {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 18px;
}

button {
    width: 55px;

    height: 55px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,0.92);

    color: #111;

    font-size: 21px;

    cursor: pointer;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.45);

    transition: transform 0.15s;
}

button:active {
    transform: scale(0.9);
}

.play {
    width: 74px;

    height: 74px;

    font-size: 28px;

    background: #f4bd55;
}

#youtube-player {
    position: absolute;

    width: 1px;

    height: 1px;

    opacity: 0;

    pointer-events: none;
}

.footer {
    margin-top: 24px;

    font-size: 10px;

    opacity: 0.55;

    letter-spacing: 1.5px;
}

</style>
</head>


<body>

<div class="player">

    <div class="online">
        ● ONLINE
    </div>

    <div class="logo">
        BOLLYWOOD RADIO
    </div>

    <div class="subtitle">
        Your Bollywood songs, one after another 🎶
    </div>

    <div class="tuning">
        🎵 Ready to play
    </div>

    <div class="equalizer">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div id="youtube-player"></div>

    <div class="controls">

        <button onclick="previousSong()">
            ⏮
        </button>

        <button class="play" onclick="playPause()">
            ▶
        </button>

        <button onclick="nextSong()">
            ⏭
        </button>

    </div>

    <div class="footer">
        BOLLYWOOD RADIO
    </div>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

const songs = [
    "Mj3KyjuKbqI",
    "O5qahfzGtc8",
    "LMpSZWT1O78",
    "7Ny77gTsWGk",
    "6NmqPrUftI8",
    "8hy7pg8wB-c",
    "A1wZUXY--4U",
    "5SGxpmPt9j0",
    "3_cGT6rXp6w",
    "XEggdtDp_4c",
    "Wk-YDaTAwyI",
    "wtlNGAXKkP4",
    "ZCLQ36O2HiA",
    "hUxn5TZzTqo",
    "5EZagydXjNU",
    "5MIGQBpVeqs"
];


/* Random song से शुरुआत */

let currentSong =
    Math.floor(Math.random() * songs.length);

let player;

let isPlaying = false;


function onYouTubeIframeAPIReady() {

    player = new YT.Player(
        "youtube-player",
        {
            videoId: songs[currentSong],

            playerVars: {
                controls: 0,
                rel: 0,
                modestbranding: 1
            },

            events: {
                onStateChange: songStateChanged
            }
        }
    );

}


function playPause() {

    if (!player) return;

    if (isPlaying) {

        player.pauseVideo();

        document.querySelector(".play").textContent = "▶";

        isPlaying = false;

    } else {

        player.playVideo();

        document.querySelector(".play").textContent = "⏸";

        isPlaying = true;

    }

}


function nextSong() {

    if (!player) return;

    currentSong++;

    if (currentSong >= songs.length) {
        currentSong = 0;
    }

    player.loadVideoById(
        songs[currentSong]
    );

    isPlaying = true;

    document.querySelector(".play").textContent = "⏸";

}


function previousSong() {

    if (!player) return;

    currentSong--;

    if (currentSong < 0) {
        currentSong = songs.length - 1;
    }

    player.loadVideoById(
        songs[currentSong]
    );

    isPlaying = true;

    document.querySelector(".play").textContent = "⏸";

}


function songStateChanged(event) {

    if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        nextSong();

    }

}

</script>

</body>
    </html>
